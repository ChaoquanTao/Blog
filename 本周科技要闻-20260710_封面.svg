<svg viewBox="0 0 900 383" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <!-- 科技周刊 004 期封面 2.35:1（900x383）AI 大乱斗主题 -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b5bff"/>
      <stop offset="55%" stop-color="#5345f0"/>
      <stop offset="100%" stop-color="#6a3df0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="clash" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#ffd166" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="383" fill="url(#bg)"/>
  <circle cx="730" cy="120" r="240" fill="url(#glow)"/>
  <circle cx="120" cy="320" r="180" fill="url(#glow)"/>

  <!-- 轨道环 -->
  <g stroke="#ffffff" fill="none" opacity="0.14">
    <ellipse cx="690" cy="190" rx="195" ry="82" stroke-width="1.5" transform="rotate(-18 690 190)"/>
    <ellipse cx="690" cy="190" rx="138" ry="56" stroke-width="1.5" transform="rotate(-18 690 190)"/>
  </g>

  <!-- 星点 -->
  <g fill="#ffffff">
    <circle cx="400" cy="92" r="2.4" opacity="0.9"/>
    <circle cx="300" cy="120" r="1.8" opacity="0.6"/>
    <circle cx="560" cy="52" r="2.2" opacity="0.8"/>
    <circle cx="830" cy="310" r="2.6" opacity="0.85"/>
    <circle cx="500" cy="340" r="1.8" opacity="0.55"/>
    <circle cx="866" cy="140" r="1.8" opacity="0.6"/>
  </g>
  <g fill="#ffffff" opacity="0.95">
    <path d="M262 348 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z"/>
    <path d="M620 340 l2.4 6.4 6.4 2.4 -6.4 2.4 -2.4 6.4 -2.4 -6.4 -6.4 -2.4 6.4 -2.4 z" opacity="0.7"/>
  </g>

  <!-- 大乱斗：四色能量球对撞 -->
  <g transform="translate(690 190)">
    <!-- 中心冲击波 -->
    <circle cx="0" cy="0" r="86" fill="url(#clash)"/>
    <!-- 冲击星芒 -->
    <g fill="#ffffff" opacity="0.95">
      <path d="M0 -30 L7 -8 L30 0 L7 8 L0 30 L-7 8 L-30 0 L-7 -8 Z"/>
    </g>
    <g stroke="#ffffff" stroke-width="2.5" opacity="0.8" stroke-linecap="round">
      <line x1="34" y1="-34" x2="48" y2="-48"/>
      <line x1="-34" y1="-34" x2="-48" y2="-48"/>
      <line x1="34" y1="34" x2="48" y2="48"/>
      <line x1="-34" y1="34" x2="-48" y2="48"/>
    </g>
    <!-- 四个来自四方的能量球（带彗尾） -->
    <g>
      <path d="M-118 -76 L-52 -32 L-64 -14 Z" fill="#ef4444" opacity="0.35"/>
      <circle cx="-58" cy="-24" r="19" fill="#ef4444"/>
      <circle cx="-64" cy="-30" r="6" fill="#ffffff" opacity="0.7"/>
    </g>
    <g>
      <path d="M124 -70 L56 -30 L68 -10 Z" fill="#22d3ee" opacity="0.35"/>
      <circle cx="60" cy="-22" r="19" fill="#22d3ee"/>
      <circle cx="54" cy="-28" r="6" fill="#ffffff" opacity="0.7"/>
    </g>
    <g>
      <path d="M-120 82 L-54 36 L-42 54 Z" fill="#22c55e" opacity="0.35"/>
      <circle cx="-50" cy="42" r="19" fill="#22c55e"/>
      <circle cx="-56" cy="36" r="6" fill="#ffffff" opacity="0.7"/>
    </g>
    <g>
      <path d="M126 78 L58 34 L46 52 Z" fill="#f97316" opacity="0.35"/>
      <circle cx="54" cy="40" r="19" fill="#f97316"/>
      <circle cx="48" cy="34" r="6" fill="#ffffff" opacity="0.7"/>
    </g>
  </g>

  <!-- 顶部标签 -->
  <g transform="translate(70 56)">
    <rect x="0" y="0" width="196" height="30" rx="15" fill="#ffffff" opacity="0.18"/>
    <text x="20" y="20" fill="#ffffff" font-size="14" font-weight="700" letter-spacing="3">AI WEEKLY · 004</text>
  </g>

  <!-- 主标题 -->
  <text x="66" y="176" fill="#ffffff" font-size="82" font-weight="800" letter-spacing="4">AI 大乱斗</text>
  <!-- 细节副题 -->
  <text x="72" y="228" fill="#ffd166" font-size="26" font-weight="700" letter-spacing="2">72 小时四箭齐发：Grok · GPT · Muse</text>
  <!-- 副标题 -->
  <text x="72" y="272" fill="#ffffff" font-size="22" font-weight="700" letter-spacing="4" opacity="0.95">科技周刊 004 期</text>
  <text x="72" y="304" fill="#ffffff" font-size="16" font-weight="500" letter-spacing="1" opacity="0.8">7.06 — 7.10 · 4 条要闻 · 3 分钟读完</text>

  <!-- 四色圆点（呼应四条新闻配色） -->
  <g transform="translate(73 336)">
    <circle cx="0" cy="0" r="7" fill="#ef4444"/>
    <circle cx="24" cy="0" r="7" fill="#2563eb"/>
    <circle cx="48" cy="0" r="7" fill="#a855f7"/>
    <circle cx="72" cy="0" r="7" fill="#22c55e"/>
  </g>
</svg>
